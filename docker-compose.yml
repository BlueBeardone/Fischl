services:
  mongo:
    image: mongo:7
    container_name: fischl-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  identity:
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    container_name: fischl-identity
    environment:
      PORT: 3001
      MONGODB_URI: mongodb://mongo:27017/fischl-identity
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "3001:3001"

  bastions:
    build:
      context: .
      dockerfile: services/bastions/Dockerfile
    container_name: fischl-bastions
    environment:
      PORT: 3002
      MONGODB_URI: mongodb://mongo:27017/fischl-bastions
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "3002:3002"
      - "3003:3003"

volumes:
  mongo-data:
